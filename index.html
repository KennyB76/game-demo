<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Twinkle Wand</title>
    <link rel="icon" href="data:," />
    <script type="module" crossorigin src="./assets/index-CXVE8BfI.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-iX2PXuN9.css">
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="hud" class="hidden">
      <div class="hud-top">
        <div class="hud-left">
          <div id="hearts" class="hearts"></div>
          <div id="stars" class="pill stars"><span id="star-icon"></span><span id="star-count">0</span></div>
        </div>
        <div id="wave" class="pill">Wave 1/2</div>
      </div>
      <div id="boss-bar" class="boss-bar hidden">
        <div class="boss-name"><span id="boss-name"></span> <span id="boss-shields" class="boss-shields"></span></div>
        <div class="bar"><div id="boss-fill" class="fill"></div><div id="boss-shield" class="shield-fill"></div></div>
      </div>
      <div id="banner" class="banner"></div>
      <div id="numbers"></div>
    </div>

    <div id="confetti"></div>

    <div id="screen-title" class="screen">
      <div class="card title-card">
        <h1 class="logo">Twinkle <span>Wand</span></h1>
        <p class="tagline">Bounce the grumpy jellies and cheer up the cloud!</p>
        <div class="controls">
          <div class="ctrl">
            <div class="keys">
              <div class="keygrid">
                <kbd class="g-w">W</kbd><kbd class="g-a">A</kbd><kbd class="g-s">S</kbd><kbd class="g-d">D</kbd>
              </div>
              <span class="or">or</span>
              <div class="keygrid">
                <kbd class="g-w">&uarr;</kbd><kbd class="g-a">&larr;</kbd><kbd class="g-s">&darr;</kbd><kbd class="g-d">&rarr;</kbd>
              </div>
            </div>
            <div class="label">Move</div>
          </div>
          <div class="ctrl">
            <div class="keys">
              <kbd class="wide">Space</kbd><span class="or">or</span><kbd>J</kbd><span class="or">or</span>
              <div class="mouse"><div class="mouse-left"></div></div>
            </div>
            <div class="label">Magic!</div>
          </div>
          <div class="ctrl">
            <div class="keys"><kbd class="wide">Shift</kbd><span class="or">or</span><kbd>K</kbd></div>
            <div class="label">Roll</div>
          </div>
          <div class="ctrl">
            <div class="keys"><kbd>R</kbd></div>
            <div class="label">Restart</div>
          </div>
        </div>
        <button id="start-btn" class="press">Press Space to Start</button>
      </div>
      <button id="progress-btn" class="corner-btn">Progress</button>
    </div>

    <div id="screen-progress" class="screen hidden">
      <div class="card progress-card">
        <h2 class="progress-title">Progress</h2>
        <div id="progress-body"></div>
      </div>
    </div>

    <div id="screen-quiz" class="screen hidden quiz-screen">
      <div class="mochi-wrap">
        <div id="quiz-mochi" class="mochi-slot"></div>
        <div id="quiz-card" class="card quiz-card"></div>
      </div>
    </div>

    <div id="screen-review" class="screen hidden">
      <div class="mochi-wrap">
        <div id="review-mochi" class="mochi-slot"></div>
        <div id="review-card" class="card review-card"></div>
      </div>
    </div>

    <div id="screen-over" class="screen hidden">
      <div class="card end-card">
        <h2>Oops!</h2>
        <p>Try again <kbd>R</kbd></p>
      </div>
    </div>

    <div id="screen-clear" class="screen hidden">
      <div class="card end-card">
        <h2 class="yay">You did it!</h2>
        <p>Play again <kbd>R</kbd></p>
      </div>
    </div>

    <div class="version"></div>
    <div id="touch-controls" aria-label="Touch controls">
      <div class="touch-dpad" aria-label="Move">
        <button data-key="ArrowUp" aria-label="Move up">▲</button>
        <button data-key="ArrowLeft" aria-label="Move left">◀</button>
        <button data-key="ArrowDown" aria-label="Move down">▼</button>
        <button data-key="ArrowRight" aria-label="Move right">▶</button>
      </div>
      <div class="touch-actions"><button data-key="Space" aria-label="Magic">Magic</button><button data-key="ShiftLeft" aria-label="Roll">Roll</button></div>
    </div>
  </body>
</html>
